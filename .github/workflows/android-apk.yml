name: Build APK Elas+

on:
  push:
    branches: [main]
    paths:
      - "capacitor.config.json"
      - "package.json"
      - ".github/workflows/android-apk.yml"
      - "public/**"
      - "assets/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor Android tooling
        run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Generate Android project
        run: |
          rm -rf android
          npx cap add android

      - name: Create branded Elas+ app icon and splash
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p assets
          convert -background none assets/elasplus-icon.svg -resize 1024x1024 assets/icon.png
          convert -size 2732x2732 gradient:'#28104e-#a31aa5' -gravity center assets/icon.png -resize 900x900 -composite assets/splash.png
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElasPlus-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Prepare public APK download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ElasPlus.apk

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Elas+ Android - Build ${{ github.run_number }}
          files: ElasPlus.apk
          make_latest: true
          generate_release_notes: true
